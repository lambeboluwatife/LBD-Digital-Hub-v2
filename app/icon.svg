<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="lbd-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18D6A0"/>
      <stop offset="100%" stop-color="#12C887"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="32" height="32" rx="7" fill="#080D0E" stroke="#1B2727" stroke-width="1.5"/>
  
  <!-- Stylized Monogram / Digital Hub Geometric Mark -->
  <path d="M 8 7 L 8 23 L 20 23" fill="none" stroke="url(#lbd-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 14 11 L 19 11 C 22.3 11 24.5 13 24.5 16 C 24.5 19 22.3 21 19 21 L 14 21" fill="none" stroke="#18D6A0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  
  <!-- Glowing Tech Dot -->
  <circle cx="21" cy="9" r="1.8" fill="#12C887" filter="url(#glow)"/>
</svg>
